# Render Blueprint — Pedra Azul / Arena Futsal
# MongoDB is NOT provided by Render. Use MongoDB Atlas and set MONGO_URL manually.
# Persistent disk for /uploads requires a paid instance (Starter+). Free plan loses files on restart.
services:
  - type: web
    name: pedra-azul
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # Attach when on Starter+ (ignored / may need dashboard attach on Free):
    disk:
      name: pedra-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_NAME
        value: arena_futsal
      - key: CORS_ORIGINS
        # Comma-separated. Runtime also replaces "*" / empty with this allowlist when RENDER is set.
        value: "https://pedra-azul.onrender.com"
      - key: MONGO_URL
        sync: false
      - key: WHATSAPP_AUTO_START
        value: "true"
      # Legacy auto-secret. start.sh unifies with INTERNAL_API_TOKEN (INTERNAL wins if both set).
      - key: WHATSAPP_INTERNAL_TOKEN
        generateValue: true
      # Preferred shared secret for FastAPI ↔ WhatsApp (X-Internal-Token).
      # openssl rand -hex 32 — set in dashboard; start.sh mirrors into WHATSAPP_INTERNAL_TOKEN.
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: WHATSAPP_ADMIN_JID
        sync: false
      # Uploads on persistent disk (local default remains backend/uploads when unset)
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # PORT is set automatically by Render
